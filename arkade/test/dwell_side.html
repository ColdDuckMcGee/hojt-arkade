<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Test af dwell.js</title>
<link rel="stylesheet" href="../arkade.css">
<style>
  body { margin: 0; background: #000; }
  .knap { position: absolute; width: 200px; height: 160px; }
  #a { left: 100px; top: 100px; }
  #b { left: 100px; top: 100px; }          /* ligger præcis oven på #a, men er skjult fra start */
  #c { left: 500px; top: 100px; }
  #gentag { left: 100px; top: 400px; }
  #dialog { position: fixed; inset: 0; background: rgba(0,0,0,.6); }
  #dialog button { position: absolute; left: 100px; top: 100px; width: 200px; height: 160px; }
</style>
</head>
<body>
<button class="knap" id="a">A</button>
<button class="knap" id="b" hidden>B</button>
<button class="knap" id="c">C</button>
<button class="knap" id="gentag" data-dwell-repeat>Gentag</button>
<div id="dialog" hidden><button id="ok">OK</button></div>
<script src="../dwell.js"></script>
<script>
  window.klik = [];
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) window.klik.push(b.id);
  }, true);
  window.dwell = ArkadeDwell.create({ enabled: true, timeMs: 400, tdWatchMs: 600000 });
</script>
</body>
</html>
