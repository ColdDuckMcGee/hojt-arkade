<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220">
  <!-- Stillbillede af Flipper til maskinens skærm: spillet er frosset, lige før kuglen når venstre flipper, og de svage sigtelinjer viser, hvor kuglen vil gå. Tegnet i SVG, ingen billeder og ingen skrifttyper. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="kugle" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c9d6ff"/><stop offset="1" stop-color="#6b6f9a"/></radialGradient>
  </defs>
  <rect width="240" height="220" fill="#0a0414"/>
  <rect x="7" y="16" width="226" height="190" rx="6" fill="#06020e" stroke="#22eaff" stroke-width="2"/>
  <!-- Bordet -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M70 200 V70 A50 46 0 0 1 170 70 V200" stroke="#22eaff" stroke-width="2"/>
    <path d="M162 200 V78" stroke="#22eaff" stroke-opacity=".6" stroke-width="1.4"/>
    <path d="M70 152 L95 182 M162 152 L137 182" stroke="#22eaff" stroke-width="2"/>
    <path d="M80 82 V108 L86 116 M152 82 V108 L146 116" stroke="#22eaff" stroke-opacity=".8" stroke-width="1.6"/>
    <path d="M78 136 L78 152 L90 160 Z M154 136 L154 152 L142 160 Z" stroke="#b07bff" stroke-width="1.6" fill="#b07bff" fill-opacity=".15"/>
  </g>
  <!-- Lysmål: tre tændte, to slukkede -->
  <g filter="url(#glow)" stroke="#ffd23a" stroke-width="1.4">
    <rect x="93" y="44" width="9" height="5" rx="1.5" fill="#ffd23a"/><rect x="104.5" y="44" width="9" height="5" rx="1.5" fill="#ffd23a"/><rect x="116" y="44" width="9" height="5" rx="1.5" fill="#ffd23a"/>
    <rect x="127.5" y="44" width="9" height="5" rx="1.5" fill="none" stroke-opacity=".6"/><rect x="139" y="44" width="9" height="5" rx="1.5" fill="none" stroke-opacity=".6"/>
  </g>
  <!-- Bumpere -->
  <g filter="url(#glow)" stroke="#ff3fd8" stroke-width="2" fill="#ff3fd8" fill-opacity=".18">
    <circle cx="102" cy="78" r="9"/><circle cx="138" cy="78" r="9"/><circle cx="120" cy="100" r="9"/>
  </g>
  <g fill="#ff3fd8" fill-opacity=".7"><circle cx="102" cy="78" r="3"/><circle cx="138" cy="78" r="3"/><circle cx="120" cy="100" r="3"/></g>
  <!-- Frysezonen -->
  <rect x="71" y="160" width="91" height="28" fill="#22eaff" fill-opacity=".05"/>
  <path d="M71 160 H162" stroke="#22eaff" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Sigtelinjer: venstre (cyan) op mod bumperne, lad være (lilla) ned i afløbet -->
  <path d="M100 172 L112 128 L120 109" fill="none" stroke="#22eaff" stroke-opacity=".75" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round"/>
  <path d="M100 172 Q110 186 116 200" fill="none" stroke="#b9a6ff" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>
  <path d="M112 193 l6 6 m0 -6 l-6 6" stroke="#ff5a6a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Flipperne -->
  <g filter="url(#glow)" stroke-linecap="round">
    <path d="M96 183 L113 192" stroke="#22eaff" stroke-width="5"/>
    <path d="M136 183 L119 192" stroke="#ff3fd8" stroke-width="5"/>
  </g>
  <!-- Kuglen med ring (frosset) -->
  <circle cx="100" cy="172" r="7.5" fill="none" stroke="#22eaff" stroke-width="1.3" filter="url(#glow)"/>
  <circle cx="100" cy="172" r="4.2" fill="url(#kugle)"/>
  <!-- Valgknapper i siderne -->
  <g filter="url(#glow)" fill="none" stroke-width="1.8" stroke-linecap="round">
    <rect x="16" y="120" width="44" height="34" rx="6" stroke="#22eaff" fill="#22eaff" fill-opacity=".14"/>
    <path d="M25 141 L41 133 M45 129 l3 -4 l3 4" stroke="#22eaff" stroke-width="2.4"/>
    <rect x="180" y="120" width="44" height="34" rx="6" stroke="#ff3fd8"/>
    <path d="M215 141 L199 133" stroke="#ff3fd8" stroke-width="2.4"/>
    <rect x="16" y="160" width="44" height="34" rx="6" stroke="#ffd23a"/>
    <path d="M23 182 L33 177 M53 182 L43 177 M38 176 v-8 m-3 3 l3 -3 l3 3" stroke="#ffd23a" stroke-width="2"/>
    <rect x="180" y="160" width="44" height="34" rx="6" stroke="#b9a6ff" stroke-dasharray="4 3"/>
    <path d="M190 172 L198 177 M214 172 L206 177 M202 168 v14 m-3 -3 l3 3 l3 -3" stroke="#b9a6ff" stroke-width="2"/>
  </g>
  <!-- Point: fem små streger som lys -->
  <g filter="url(#glow)" fill="#ffd23a"><rect x="22" y="40" width="32" height="4" rx="2"/><rect x="22" y="50" width="24" height="4" rx="2" fill-opacity=".5"/></g>
  <g filter="url(#glow)" fill="#22eaff"><circle cx="190" cy="42" r="4"/><circle cx="202" cy="42" r="4"/><circle cx="214" cy="42" r="4" fill-opacity=".3"/></g>
</svg>
