<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220">
  <!-- Stillbillede af Kælderen til maskinens skærm: en neonkælder set i førsteperson. En gang går ind i billedet med lilla vægpaneler med små cyan lys, pink lysstofrør i loftet og cyan linjer i gulvet. For enden lyser en låst dør med en grøn lampe. Midt i gangen står en kravler (en lille robot med et pink øje) med en grøn livbjælke over sig, og et sigtekorn peger på den. Nederst til højre ses spillerens våben, øverst til højre et lille kort. Tegnet i SVG, ingen billeder og ingen skrifttyper. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="taage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0b33"/><stop offset=".5" stop-color="#2a1250"/><stop offset="1" stop-color="#120726"/></linearGradient>
    <radialGradient id="moerke" cx=".5" cy=".5" r=".75"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  </defs>
  <rect width="240" height="220" fill="#0a0414"/>
  <!-- loft og gulv -->
  <path d="M0 0H240L150 82H90Z" fill="#1c0d38"/>
  <path d="M0 220H240L150 132H90Z" fill="#160a2e"/>
  <!-- venstre og højre væg -->
  <path d="M0 0L90 82V132L0 220Z" fill="#2b1556"/>
  <path d="M240 0L150 82V132L240 220Z" fill="#2b1556"/>
  <!-- vægpaneler -->
  <g fill="none" stroke="#5b34a8" stroke-width="1.5" stroke-opacity=".8">
    <path d="M12 26L48 52V116L12 150ZM56 58L82 76V124L56 140Z"/>
    <path d="M228 26L192 52V116L228 150ZM184 58L158 76V124L184 140Z"/>
  </g>
  <g fill="#39e8ff" filter="url(#glow)">
    <rect x="26" y="70" width="6" height="6"/><rect x="66" y="92" width="4" height="4"/>
    <rect x="208" y="70" width="6" height="6"/><rect x="170" y="92" width="4" height="4"/>
  </g>
  <!-- endevæg med låst dør -->
  <rect x="90" y="82" width="60" height="50" fill="url(#taage)"/>
  <rect x="108" y="88" width="24" height="44" rx="2" fill="#2a2140" stroke="#8a5cff" stroke-width="1.2"/>
  <path d="M120 88V132" stroke="#140a26" stroke-width="1.5"/>
  <rect x="124" y="104" width="4" height="8" rx="1" fill="#3dff8a" filter="url(#glow)"/>
  <!-- lysstofrør i loftet -->
  <g fill="#ff6bf0" filter="url(#glow)">
    <path d="M70 12H170L160 20H80Z"/>
    <path d="M98 44H142L138 50H102Z"/>
    <path d="M110 66H130L128 70H112Z"/>
  </g>
  <!-- cyan linjer i gulvet -->
  <g stroke="#39e8ff" stroke-width="1.6" filter="url(#glow)" opacity=".8">
    <path d="M40 220L104 132M200 220L136 132"/>
    <path d="M60 176H180" stroke-opacity=".5"/>
  </g>
  <!-- kravleren -->
  <g>
    <ellipse cx="120" cy="158" rx="22" ry="4" fill="#000" fill-opacity=".45"/>
    <path d="M104 146L96 160M136 146L144 160M108 150L104 162M132 150L136 162" stroke="#d9cfff" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="120" cy="140" rx="20" ry="14" fill="#cfc4f5" stroke="#4a3a80" stroke-width="1.5"/>
    <circle cx="120" cy="139" r="7" fill="#ff3f9a" filter="url(#glow)"/>
    <circle cx="120" cy="139" r="3" fill="#ffd0ea"/>
  </g>
  <!-- livbjælke over fjenden -->
  <rect x="100" y="114" width="40" height="6" rx="3" fill="#1a1030" stroke="#ffffff" stroke-opacity=".6"/>
  <rect x="100" y="114" width="40" height="6" rx="3" fill="#3dff8a"/>
  <path d="M120 115V119" stroke="#1a1030" stroke-width="1"/>
  <!-- sigtekorn -->
  <g stroke="#ffe14d" stroke-width="1.6" filter="url(#glow)">
    <path d="M120 128V133M120 145V150M109 139H114M126 139H131"/>
  </g>
  <!-- våbnet -->
  <path d="M150 220L156 186Q160 180 168 180H182Q188 180 188 186L186 220Z" fill="#3a3550" stroke="#8a86a8" stroke-width="1.2"/>
  <rect x="158" y="198" width="28" height="4" fill="#39e8ff" filter="url(#glow)"/>
  <!-- mørke hjørner -->
  <rect width="240" height="220" fill="url(#moerke)"/>
  <!-- minikort -->
  <rect x="196" y="8" width="36" height="36" fill="#0a0414" fill-opacity=".85" stroke="#39e8ff" stroke-width="1.2"/>
  <path d="M204 14H226V22H216V38H208V22H204Z" fill="#8a7cff"/>
  <rect x="216" y="14" width="4" height="4" fill="#3dff8a"/>
  <path d="M212 34L210 38H214Z" fill="#39e8ff"/>
  <circle cx="212" cy="27" r="2" fill="#ff3f6a"/>
</svg>
