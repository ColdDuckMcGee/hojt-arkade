<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220">
  <!-- Stillbillede af Rumhandleren til maskinens skærm: stjernekortet med planeter i tre farver (cyan Vega-unionen, pink Orion-kompagniet, orange Kantlauget), forbundet af hop-linjer med antal dage. Spillerens planet er markeret med en gul ring, og et cyan handelsskib flyver mod nabo-planeten med en kasse last. En tyk cyan linje er en fast handelsrute, og et gult advarselsskilt viser en nyhed. Nederst en lille prispil op (grøn) og ned (pink). Tegnet i SVG, ingen billeder og ingen skrifttyper. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="rum" cx="0.5" cy="0.45" r="0.75"><stop offset="0" stop-color="#1c0b3e"/><stop offset="1" stop-color="#07031a"/></radialGradient>
    <clipPath id="ramme"><rect x="12" y="16" width="216" height="192" rx="5"/></clipPath>
  </defs>
  <rect width="240" height="220" fill="#0a0414"/>
  <rect x="7" y="11" width="226" height="202" rx="7" fill="#05030f" stroke="#22eaff" stroke-width="2"/>
  <g clip-path="url(#ramme)">
    <rect x="12" y="16" width="216" height="192" fill="url(#rum)"/>
    <!-- stjerner -->
    <g fill="#f6ecff" fill-opacity=".55"><circle cx="24" cy="30" r="0.9"/><circle cx="58" cy="22" r="0.7"/><circle cx="96" cy="34" r="1"/><circle cx="150" cy="24" r="0.8"/><circle cx="214" cy="40" r="1"/><circle cx="198" cy="96" r="0.7"/><circle cx="20" cy="110" r="0.8"/><circle cx="44" cy="190" r="1"/><circle cx="122" cy="200" r="0.7"/><circle cx="206" cy="196" r="0.9"/><circle cx="168" cy="132" r="0.6"/><circle cx="80" cy="100" r="0.6"/><circle cx="132" cy="70" r="0.7"/></g>
    <!-- hop-linjer -->
    <g stroke="#b8a6e8" stroke-opacity=".45" stroke-width="1.4" fill="none"><path d="M52 64 L104 92"/><path d="M104 92 L170 70"/><path d="M104 92 L120 150"/><path d="M170 70 L196 128"/><path d="M120 150 L196 128"/><path d="M52 64 L58 140"/></g>
    <g stroke="#ffb340" stroke-opacity=".8" stroke-width="1.4" stroke-dasharray="4 3" fill="none"><path d="M58 140 L120 150"/><path d="M196 128 L176 186"/></g>
    <!-- fast handelsrute -->
    <path d="M52 64 L104 92" stroke="#22eaff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- dage på hop -->
    <g fill="#f6ecff" fill-opacity=".75"><circle cx="137" cy="81" r="1.6"/><circle cx="141" cy="81" r="1.6"/><circle cx="112" cy="121" r="1.6"/><circle cx="183" cy="99" r="1.6"/><circle cx="183" cy="104" r="1.6"/><circle cx="183" cy="109" r="1.6"/></g>
    <!-- planeter -->
    <g filter="url(#glow)">
      <g stroke="#22eaff" stroke-width="2" fill="#0b3a52"><circle cx="52" cy="64" r="10"/><ellipse cx="52" cy="64" rx="17" ry="5" fill="none" transform="rotate(-18 52 64)"/></g>
      <g stroke="#22eaff" stroke-width="2" fill="#0b3a52"><circle cx="104" cy="92" r="8"/><ellipse cx="104" cy="92" rx="14" ry="4" fill="none" transform="rotate(-18 104 92)"/></g>
      <g stroke="#ff4fd8" stroke-width="2" fill="#4a0f45"><circle cx="170" cy="70" r="11"/><path d="M160 66 h20 M159 71 h22 M161 76 h18" stroke-width="1.4"/></g>
      <g stroke="#ff4fd8" stroke-width="2" fill="#4a0f45"><circle cx="120" cy="150" r="9"/><path d="M112 147 h16 M112 152 h16" stroke-width="1.4"/></g>
      <g stroke="#ffb340" stroke-width="2" fill="#4a2a08"><path d="M190 120 l9 -2 l6 7 l-2 9 l-9 3 l-7 -6 z"/><circle cx="196" cy="126" r="1.6"/><circle cx="200" cy="132" r="1.2"/></g>
      <g stroke="#ffb340" stroke-width="2" fill="#4a2a08"><path d="M170 180 l8 -2 l6 6 l-2 8 l-8 3 l-6 -5 z"/><circle cx="176" cy="186" r="1.4"/></g>
      <g stroke="#b8a6e8" stroke-width="2" fill="#1d1640" stroke-opacity=".8"><circle cx="58" cy="140" r="8"/><path d="M54 140 h8 v6 h-8 z M55.5 140 v-3 a2.5 2.5 0 0 1 5 0 v3" stroke-width="1.3"/></g>
      <!-- spillerens planet -->
      <circle cx="104" cy="92" r="17" stroke="#ffe14d" stroke-width="2.4" fill="none"/>
      <path d="M104 72 v5 M104 107 v5 M84 92 h5 M119 92 h5" stroke="#ffe14d" stroke-width="2.4" stroke-linecap="round"/>
      <!-- nyhed: advarsel -->
      <path d="M152 48 l7 -12 l7 12 z" fill="#ffe14d" stroke="#ffe14d" stroke-width="1" stroke-linejoin="round"/>
      <path d="M159 40 v4 M159 46 v0.6" stroke="#0a0414" stroke-width="1.6" stroke-linecap="round"/>
      <!-- handelsskib på vej mod Orion -->
      <g transform="translate(136 74) rotate(-18)">
        <path d="M-12 -5 h16 l8 5 l-8 5 h-16 z" fill="#0b3a52" stroke="#22eaff" stroke-width="2" stroke-linejoin="round"/>
        <path d="M-8 -3.5 v7 M-2 -3.5 v7" stroke="#22eaff" stroke-width="1.4"/>
        <path d="M-12 -2 l-6 2 l6 2" fill="#ff4fd8" stroke="#ff4fd8" stroke-width="1" stroke-linejoin="round"/>
        <circle cx="7" cy="0" r="1.4" fill="#ffe14d"/>
      </g>
      <!-- prispile -->
      <path d="M30 198 l6 -9 l6 9 z" fill="#39ff6a"/>
      <path d="M48 189 l6 9 l6 -9 z" fill="#ff4fd8"/>
      <!-- kreditmønt -->
      <circle cx="212" cy="30" r="7" fill="none" stroke="#ffe14d" stroke-width="2"/>
      <path d="M214.5 27 a3.5 3.5 0 1 0 0 6" fill="none" stroke="#ffe14d" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
