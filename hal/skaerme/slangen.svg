      <rect x="112" y="112" width="16" height="16" rx="3"/><rect x="132" y="112" width="16" height="16" rx="3"/>
    </g>
    <rect x="151" y="111" width="18" height="18" rx="4" fill="#ffb8f2" stroke="#fff" stroke-width="1.5"/>
    <circle cx="163" cy="116" r="2" fill="#2a0525"/><circle cx="163" cy="124" r="2" fill="#2a0525"/>
    <rect x="194" y="114" width="12" height="12" rx="2" fill="#22eaff"/>
