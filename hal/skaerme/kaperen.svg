  <!-- Stillbillede af Kaperen til maskinens skærm: havet set oppefra i tåge. Midt i synsvidden (stiplet cyan cirkel) sejler spillerens skib (cyan, set oppefra) mod nordøst. Felterne i sigte er klart hav med bølger og grønne øer med gul kystlinje, palmer, bjerg og skov. Bag skibet ligger havnen, det kom fra (pink huse og gul lanterne), og havet, man har set før, er dunkelt. Til højre lurer et sørøverskib med orange flag. Resten ligger i lilla tåge. Tegnet i SVG, ingen billeder og ingen skrifttyper. -->
